[build-system]
requires = ["setuptools>=83,<84", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-tlf-review-demo"
version = "0.1.0"
description = "Synthetic portfolio demonstration of an AI-assisted clinical TLF review workflow"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = {file = "LICENSE"}
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.12,<1",
  "pypdf>=5,<7",
  "pdfplumber>=0.11,<1",
  "pypdfium2>=4,<6",
  "openpyxl>=3.1,<4",
  "pyyaml>=6,<7",
  "anthropic>=0.116,<1",
  "truststore>=0.9,<1",
]

[project.optional-dependencies]
demo = ["reportlab>=4.2,<6"]
dev = [
  "reportlab>=4.2,<6",
  "fpdf2>=2.8,<3",
  "bandit>=1.9,<2",
  "pytest>=8.3,<10",
  "httpx>=0.28,<1",
  "coverage[toml]>=7.6,<8",
  "ruff>=0.9,<1",
  "pip-audit>=2.7,<3",
]

[tool.setuptools]
py-modules = [
  "ai_client",
  "ai_review",
  "chat",
  "checks",
  "db",
  "export",
  "indexer",
  "main",
  "pdftools",
  "project_io",
  "runner",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "evaluation/tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
branch = true
source = ["."]
omit = [
  "runtime/*",
  "tests/*",
  ".venv/*",
  "public_release.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 110
exclude = ["runtime", "data", "dist", "build"]

[tool.ruff.lint]
# Start with correctness-oriented rules that the existing codebase passes. Broader
# style cleanup is tracked separately so CI does not pretend a red lint job is a gate.
select = ["E9", "F63", "F7", "F82"]

[tool.bandit]
exclude_dirs = [
  ".git",
  ".venv",
  "build",
  "data",
  "demo/artifacts",
  "dist",
  "runtime",
  "tests",
  "evaluation/tests",
]
