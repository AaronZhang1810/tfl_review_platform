services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # This application has no authentication. Keep it bound to loopback.
      - "127.0.0.1:8000:8000"
    environment:
      TLF_DEMO_MODE: "1"
      TLF_MAX_INFLIGHT: "2"
      TLF_MAX_TARGETS: "100"
      TLF_DATA_DIR: "/app/demo-data/current"
    volumes:
      - demo-data:/app/demo-data
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  demo-data:
